name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test on the pinned Goose
    # The repository is public and these are the fleet's self-hosted runners:
    # a pull request from a fork never runs on them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow invariants
        run: make check-ci

      - name: ROADMAP.md is what docs/roadmap.sexp renders
        run: PATH="$HOME/.local/bin:$PATH" make roadmap-check

      - name: Fetch the pinned Goose toolchain
        run: make dist-goose

      - name: Test
        run: make test

      - name: Fuzz
        run: if [ -f make/fuzz.mk ]; then make fuzz; fi

      - name: Bench check
        run: if [ -f make/bench.mk ]; then make bench-check; fi

  corpus:
    name: STANDARD.md and conformance/ match the corpus pin
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    env:
      SERIALIZE_TAG: v1.17.0
    steps:
      - uses: actions/checkout@v4

      # STANDARD.md and conformance/ are VERBATIM vendored copies (DESIGN.md,
      # "The vendored standard"). They must be the pinned release's own bytes;
      # a divergence is red, never a skip.
      - name: Check out the reference at the corpus pin
        run: rm -rf "$RUNNER_TEMP/serialize" && git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git "$RUNNER_TEMP/serialize"

      - name: The vendored corpus and standard are the pin's
        run: |
          diff -ru "$RUNNER_TEMP/serialize/conformance" conformance
          diff -ru "$RUNNER_TEMP/serialize/STANDARD.md" STANDARD.md
